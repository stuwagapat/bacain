#     jauh di hilir dengan "cannot find symbol: FilePickerPlugin".
#
#   • Dengan flag menyala, giliran flutter_plugin_android_lifecycle yang gagal
#     — AGP 9 menolak modul yang masih tersentuh plugin Kotlin lama.
#
# Keduanya menyematkan AGP 8 di buildscript masing-masing (8.5.1 dan 8.13.1),
# jadi AGP 8 memang yang mereka uji. Naikkan lagi ke AGP 9 setelah kedua paket
# itu sepakat.

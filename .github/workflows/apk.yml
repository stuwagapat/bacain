name: Bangun APK Android

# APK dibangun di sini, bukan di mesin pengembang: runner GitHub sudah
# membawa Android SDK lengkap. Hasilnya diunggah sebagai artifact yang bisa
# diunduh dan langsung dipasang di HP.
on:
  workflow_dispatch:
  push:
    branches: [claude/app-pembaca-buku-ai-du5dtq]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    # Konteks `secrets` tidak bisa dipakai di `if` sebuah step, jadi
    # keberadaannya dititipkan lewat env tingkat job.
    env:
      ADA_KUNCI: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Kredensial suara AI ditanam saat build, jadi tidak ada yang perlu
      # diketik di HP. Nilainya datang dari Secrets — tidak pernah ada di
      # kode sumber maupun riwayat git.
      #
      # Isi SALAH SATU di Settings → Secrets and variables → Actions:
      #   BACAIN_TTS_URL  alamat server sendiri. Kunci Google tinggal di
      #                   server, tidak ikut ke APK. Ini yang aman dibagikan.
      #   BACAIN_TTS_KEY  kunci Google langsung. Untuk build milik sendiri
      #                   saat menilai suara — APK-nya jangan dibagikan.
      TTS_URL: ${{ secrets.BACAIN_TTS_URL }}
      TTS_KEY: ${{ secrets.BACAIN_TTS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Ambil dependensi
        working-directory: app
        run: flutter pub get

      # Uji dijalankan sebelum build. APK yang lolos pipa ini berarti seluruh
      # logika inti — segmentasi, pemutar, jatah harian — masih utuh.
      - name: Uji
        working-directory: app
        run: flutter test

      # Kunci penandatanganan dipasang HANYA kalau secret-nya sudah diisi.
      # Tanpa itu build tetap jalan dengan kunci debug, tapi tanda tangannya
      # berubah tiap kali dibangun — penguji harus menghapus app dulu sebelum
      # memasang versi berikutnya, dan progres mereka ikut hilang.
      - name: Pasang kunci penandatanganan
        if: env.ADA_KUNCI == 'true'
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bacain.jks"
          {
            echo "storeFile=$RUNNER_TEMP/bacain.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      # APK universal — satu berkas untuk semua jenis prosesor. Lebih besar
      # daripada dipecah per-ABI, tapi penguji tidak perlu menebak mana yang
      # cocok untuk HP-nya.
      - name: Bangun APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-number ${{ github.run_number }} \
            --dart-define=BACAIN_TTS_URL="$TTS_URL" \
            --dart-define=BACAIN_TTS_KEY="$TTS_KEY"

      - name: Bersihkan kunci
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/bacain.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: bacain-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
